<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Clínica del Hogar - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    /* Personalización con los colores del negocio */
    .bg-azul-negocio { background-color: #0d47a1 !important; } /* Azul Rey/Oscuro */
    .text-amarillo-negocio { color: #ffeb3b !important; }     /* Amarillo */
    
    /* Corrección para el botón azul del negocio */
    .btn-azul-negocio {
        background-color: #0d47a1 !important;
        color: #ffffff !important; /* Texto blanco asegurado */
        font-weight: bold;
    }
    .btn-azul-negocio:hover {
        background-color: #0a3a82 !important;
        color: #ffffff !important;
    }

    .btn-amarillo-negocio {
        background-color: #fbc02d;
        color: #000;
        font-weight: bold;
    }
    .btn-amarillo-negocio:hover {
        background-color: #f9a825;
        color: #000;
    }
    .navbar-brand font { font-weight: bold; }
</style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-azul-negocio shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fs-4" href="#">
                <i class="bi bi-wrench-adjustable text-amarillo-negocio me-2"></i>
                La Clínica <span class="text-amarillo-negocio">del Hogar</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-autofs-5">
                    <li class="nav-item me-3">
                        <a class="nav-link active" href="/"><i class="bi bi-box-seam me-1"></i> Inventario</a>
                    </li>
                    <li class="nav-item">
                        <a href="/ventas" class="nav-link text-white fw-bold">
                            <i class="bi bi-cash-register me-2"></i>Módulo de Ventas
                        </a>    
                    </li>
                    <li class="nav-item">
                        <a href="/historial" class="nav-link text-white fw-bold">
                        <i class="bi bi-journal-text me-2"></i>Historial de Ventas
                        </a>                
                    </li>
                    <li>
                        <a class="nav-link" href="/reportes">
                        <i class="bi bi-bar-chart-line-fill me-2"></i> Reportes
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm ms-auto">
    Cerrar Sesión ({{ session['usuario'] }})
</a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>

    <div class="container mt-4 bg-white p-4 rounded shadow-sm">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
